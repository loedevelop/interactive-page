<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>重設密碼 - LogOnEnglish</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #FF8C00; --bg-color: #FFF8E1; --text-color: #4A4A4A; --error-color: #E53935; }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(#FFA500 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .box {
            background: white;
            padding: 36px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(255, 140, 0, 0.15);
        }
        h1 { margin: 0 0 8px; font-size: 1.5rem; color: var(--primary-color); }
        p { color: #64748B; font-size: 0.9rem; margin: 0 0 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #EEE;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        .pwd-wrap { position: relative; }
        .pwd-wrap input { padding-right: 45px; margin-bottom: 16px; }
        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-color);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #msg { margin-top: 14px; font-weight: 800; min-height: 20px; font-size: 0.9rem; }
        .back { display: block; text-align: center; margin-top: 18px; color: #64748B; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 重設密碼</h1>
        <p id="status-text">請設定您的新密碼。</p>

        <div id="reset-form" style="display:none;">
            <label for="new-password">新密碼</label>
            <div class="pwd-wrap">
                <input type="password" id="new-password" placeholder="至少 6 個字元">
                <button type="button" class="toggle-btn" id="toggleNewPwd" title="顯示密碼">👁️</button>
            </div>
            <label for="confirm-password">確認新密碼</label>
            <div class="pwd-wrap">
                <input type="password" id="confirm-password" placeholder="再次輸入新密碼">
                <button type="button" class="toggle-btn" id="toggleConfirmPwd" title="顯示密碼">👁️</button>
            </div>
            <button type="button" class="btn" id="savePasswordBtn">💾 儲存新密碼</button>
        </div>

        <div id="msg"></div>
        <a class="back" href="./index.html">← 返回登入</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./020_js_core/supabase-client.js?v=18"></script>
    <script>
        function bindToggle(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', function() {
                const input = document.getElementById(inputId);
                if (input.getAttribute('type') === 'password') {
                    input.setAttribute('type', 'text');
                    this.textContent = '🙈';
                } else {
                    input.setAttribute('type', 'password');
                    this.textContent = '👁️';
                }
            });
        }

        bindToggle('toggleNewPwd', 'new-password');
        bindToggle('toggleConfirmPwd', 'confirm-password');

        async function initResetPage() {
            const msgEl = document.getElementById('msg');
            const formEl = document.getElementById('reset-form');
            const statusText = document.getElementById('status-text');

            let retries = 0;
            while (!window.supabaseClient && retries < 20) {
                await new Promise(function(r) { setTimeout(r, 150); });
                retries++;
            }
            if (!window.supabaseClient) {
                msgEl.style.color = '#E53935';
                msgEl.textContent = '❌ 無法載入連線，請重新整理';
                return;
            }

            const { data: sessionData, error: sessionErr } = await window.supabaseClient.auth.getSession();
            if (sessionErr || !sessionData.session) {
                statusText.textContent = '連結無效或已過期，請回登入頁重新申請。';
                msgEl.style.color = '#E53935';
                msgEl.textContent = '❌ 無法驗證重設連結';
                return;
            }

            formEl.style.display = 'block';
            statusText.textContent = '已驗證身分，請設定新密碼。';

            document.getElementById('savePasswordBtn').addEventListener('click', async function() {
                const pwd = document.getElementById('new-password').value.trim();
                const confirmPwd = document.getElementById('confirm-password').value.trim();
                const btn = this;

                msgEl.textContent = '';
                if (!pwd || pwd.length < 6) {
                    msgEl.style.color = '#E53935';
                    msgEl.textContent = '❌ 新密碼至少 6 個字元';
                    return;
                }
                if (pwd !== confirmPwd) {
                    msgEl.style.color = '#E53935';
                    msgEl.textContent = '❌ 兩次輸入的密碼不一致';
                    return;
                }

                btn.disabled = true;
                btn.textContent = '⏳ 儲存中...';

                const { error } = await window.supabaseClient.auth.updateUser({ password: pwd });
                if (error) {
                    msgEl.style.color = '#E53935';
                    msgEl.textContent = '❌ ' + error.message;
                    btn.disabled = false;
                    btn.textContent = '💾 儲存新密碼';
                    return;
                }

                msgEl.style.color = '#059669';
                msgEl.textContent = '✅ 密碼已更新，即將返回登入頁...';
                setTimeout(function() {
                    window.location.replace('./index.html?build=v7&_=' + Date.now());
                }, 1500);
            });
        }

        window.addEventListener('DOMContentLoaded', initResetPage);
    </script>
</body>
</html>
