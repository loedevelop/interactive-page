<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- v42 核心：解除縮放封印，允許原生 zoom 以便讓 Google Drive 能夠放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生學習區 | LogOnEnglish</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- v55 終極更新：強制破除快取，釋放最新 UI 狀態與 AI 容錯卡片 -->
    <link rel="stylesheet" href="../010_css/style.css?v=55">
    
    <style>
        body {
            display: block !important;
            height: auto !important;
            overflow: auto !important;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
            /* v42 移除 touch-action 限制，完全釋放手勢控制 */
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-profile { border: 2px solid #E2E8F0; color: #475569; background: white; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-profile:hover { border-color: #CBD5E1; background: #F8FAFC; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-box { background: white; width: 90%; max-width: 520px; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 5px; color: #475569; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px; outline: none; font-size: 1rem; box-sizing: border-box; }
        .form-group input:disabled { background: #F1F5F9; color: #94A3B8; cursor: not-allowed; }
        .btn-primary { background: #F59E0B; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-primary:hover { background: #D97706; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div>
            <h1 id="dynamic-student-title" style="margin: 0;">LogOnEnglish | 載入中... 🚀</h1>
            <div id="class-switcher-container" style="margin-top: 8px; display: none;">
                <select id="class-switcher" onchange="switchClass(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 2px solid #E2E8F0; font-weight: 800; color: #475569; background: #F8FAFC; cursor: pointer; outline: none;">
                </select>
            </div>
        </div>
        
        <div class="header-actions">
            <button class="btn-profile js-switch-persona" onclick="if(window.switchPersona) { window.switchPersona(); }">🎭 切換身分</button>
            <button class="btn-profile" onclick="openProfileModal()">👤 個人資料</button>
            <button class="logout-btn" onclick="if(window.logoutUser) { window.logoutUser(); } else { localStorage.clear(); sessionStorage.clear(); window.location.replace('../index.html'); }">登出系統</button>
        </div>
    </div>

    <nav class="tabs-nav">
        <button class="tab-link active" onclick="window.FeatureStudentTimeline.switchView('progress', this)">課程進度</button>
        <button class="tab-link" onclick="window.FeatureStudentTimeline.switchView('resources', this)">課程資源</button>
        <button class="tab-link" onclick="window.FeatureStudentTimeline.switchView('personal', this)">個人作品</button>
        <button class="tab-link" onclick="window.FeatureStudentTimeline.switchView('class', this)">班級作品</button>
    </nav>

    <div id="view-progress" class="view-content active">
        <div id="course-container"></div>
    </div>

    <div id="view-resources" class="view-content">
        <div id="resource-container"></div>
    </div>

    <div id="view-personal" class="view-content">
        <div class="card">
            <h3>🎨 我的作品空間</h3>
            <p style="color:#888; font-weight:600;">這裡存放你繳交過的優秀作業與錄音作品。</p>
            <div class="portfolio-grid">
                <div class="work-card">
                    <div class="work-thumb">🎙️</div>
                    <div class="work-info">
                        <span class="work-title">Self-Intro Recording</span>
                        <span class="work-date">2026/05/10</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-class" class="view-content">
        <div class="card">
            <h3>👥 班級榮譽榜</h3>
            <p style="color:#888; font-weight:600;">看看同學們分享的精彩內容！</p>
            <div class="portfolio-grid" id="class-works">
                <div class="work-card">
                    <div class="work-thumb" style="background:#FFF9C4;">✍️</div>
                    <div class="work-info">
                        <span class="work-title">Group A: Story Telling</span>
                        <span class="work-date">2026/05/20</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 style="margin-top:0; color:#334155; font-weight:900;">👤 個人資料管理</h2>
            
            <div class="form-group">
                <label>登入帳號 (唯讀)</label>
                <input type="text" id="profile-account" disabled>
            </div>

            <div class="form-group" style="background:#F8FAFC; padding:15px; border-radius:8px; border:1px dashed #CBD5E1;">
                <label>👁️ 系統姓名預覽</label>
                <input type="text" id="profile-sysDisplayName" disabled style="background:#DBEAFE; color:#1E3A8A; font-weight:bold;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                    <div><label style="font-size:0.8rem;">英文名字</label><input type="text" id="profile-nameEN" placeholder="Amy"></div>
                    <div><label style="font-size:0.8rem;">護照姓氏</label><input type="text" id="profile-passLast" placeholder="Lin"></div>
                    <div><label style="font-size:0.8rem;">護照名字</label><input type="text" id="profile-passFirst" placeholder="Mei-Ling"></div>
                    <div><label style="font-size:0.8rem;">中文姓氏</label><input type="text" id="profile-lastCN" placeholder="林"></div>
                    <div><label style="font-size:0.8rem;">中文名字</label><input type="text" id="profile-firstCN" placeholder="美玲"></div>
                </div>
            </div>

            <div class="form-group">
                <label>聯絡電話 (選填)</label>
                <input type="tel" id="profile-phone" placeholder="例如: 0912-345-678">
            </div>

            <div class="form-group">
                <label>修改密碼 (若不修改請留白)</label>
                <div style="position:relative;">
                    <input type="password" id="profile-password" placeholder="輸入新密碼" style="padding-right:45px;">
                    <button type="button" id="profile-password-toggle" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; color:#888;" title="顯示密碼">👁️</button>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>專屬 Google Drive 連結 (唯讀)</label>
                <input type="text" id="profile-drive" disabled>
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-profile" onclick="document.getElementById('profile-modal').style.display='none'">取消</button>
                <button class="btn-primary" onclick="saveProfile()">💾 儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 順序鐵律：config ➡️ supabase ➡️ auth ➡️ store ➡️ api ➡️ utils-date ➡️ templates ➡️ features -->
    <script src="../020_js_core/config.js?v=55"></script>
    <script type="module" src="../020_js_core/supabase-client.js?v=55"></script>
    <script src="../020_js_core/profile-form.js?v=1"></script>
    <script src="../020_js_core/persona-routing.js?v=9"></script>
    <script src="../020_js_core/ui-flash.js?v=2"></script>
    <script src="../020_js_core/auth-guard.js?v=59"></script>
    <script src="../020_js_core/store.js?v=55"></script>
    
    <script src="../020_js_core/api.js?v=56"></script> 
    <script src="../020_js_core/utils-date.js?v=55"></script>
    <script src="../020_js_core/grading-policy.js?v=1"></script>
    <script src="../020_js_core/task-script-resolver.js?v=1"></script>

    <script src="../120_student_core/ui-audio-templates.js?v=57"></script>
    <script src="../120_student_core/ui-student-timeline-templates.js?v=104"></script>

    <script defer src="../120_student_core/feature-student-audio.js?v=58"></script>
    <script defer src="../120_student_core/feature-student-resource.js?v=55"></script>
    <script defer src="../120_student_core/feature-student-timeline.js?v=73"></script> 
    
    <script defer>
        function switchClass(newClassId) {
            try {
                sessionStorage.setItem('currentClassId', newClassId);
                const sessionData = JSON.parse(localStorage.getItem('LogOnEnglish_Session') || '{}');
                if (sessionData.id) {
                    const lastKey = window.PersonaRouting
                        ? window.PersonaRouting.getLastClassKey(sessionData.id, 'student')
                        : `LogOnEnglish_LastClass_${sessionData.id}_student`;
                    localStorage.setItem(lastKey, newClassId);
                }
                window.location.reload();
            } catch (e) {
                console.error('切換班級失敗', e);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const headerTitle = document.getElementById('dynamic-student-title');
            const switcherContainer = document.getElementById('class-switcher-container');
            
            switcherContainer.style.display = 'block';
            switcherContainer.innerHTML = '<span style="color:#94A3B8; font-size:0.9rem; font-weight:800;">⏳ 正在連線資料庫驗證班級...</span>';

            const initInterval = setInterval(async () => {
                if (window.supabaseClient) {
                    clearInterval(initInterval);
                    
                    try {
                        const { data: { user }, error: authErr } = await window.supabaseClient.auth.getUser();
                        if (authErr || !user) throw new Error("授權無效或已登出");

                        const { data: profile } = await window.supabaseClient
                            .from('profiles')
                            .select('name')
                            .eq('id', user.id)
                            .single();
                            
                        const displayName = (profile && profile.name) ? profile.name : 'Student';
                        headerTitle.innerText = `LogOnEnglish | ${displayName} 🚀`;
                        document.title = `${displayName} 的專屬教室 | LogOnEnglish`;

                        const linkedIds = window.PersonaRouting
                            ? await window.PersonaRouting.getLinkedUserIds(window.supabaseClient, user.id, user.email ? user.email : '')
                            : [user.id];

                        const { data: enrollData, error: enrollErr } = await window.supabaseClient
                            .from('student_enrollments')
                            .select('class_id')
                            .in('user_id', linkedIds)
                            .is('deleted_at', null);

                        if (enrollErr) throw enrollErr;

                        let classIds = [];
                        if (enrollData && enrollData.length > 0) {
                            classIds = [...new Set(enrollData.map(row => row.class_id))];
                        }

                        if (classIds.length > 0) {
                            const { data: classes, error: classErr } = await window.supabaseClient
                                .from('classes')
                                .select('id, name')
                                .in('id', classIds)
                                .is('deleted_at', null);

                            if (classErr) throw classErr;

                            if (classes && classes.length > 0) {
                                const lastKey = window.PersonaRouting
                                    ? window.PersonaRouting.getLastClassKey(user.id, 'student')
                                    : `LogOnEnglish_LastClass_${user.id}_student`;
                                let lastClassId = sessionStorage.getItem('currentClassId') || localStorage.getItem(lastKey);
                                if (!lastClassId || !classes.some(c => c.id === lastClassId)) {
                                    lastClassId = classes[0].id; 
                                }

                                sessionStorage.setItem('currentClassId', lastClassId);
                                localStorage.setItem(lastKey, lastClassId);

                                let optsHtml = `<select id="class-switcher" onchange="switchClass(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 2px solid #E2E8F0; font-weight: 800; color: #475569; background: #F8FAFC; cursor: pointer; outline: none;">`;
                                classes.forEach(cls => {
                                    const isSelected = cls.id === lastClassId ? 'selected' : '';
                                    optsHtml += `<option value="${cls.id}" ${isSelected}>📚 課程：${cls.name}</option>`;
                                });
                                optsHtml += `</select>`;
                                switcherContainer.innerHTML = optsHtml;

                                if (window.FeatureStudentTimeline && typeof window.FeatureStudentTimeline.init === 'function') {
                                    window.FeatureStudentTimeline.init();
                                }
                            } else {
                                switcherContainer.innerHTML = '<span style="color:#94A3B8; font-size:0.9rem; font-weight:800;">(目前所屬班級皆已封存或刪除)</span>';
                            }
                        } else {
                            switcherContainer.innerHTML = '<span style="color:#94A3B8; font-size:0.9rem; font-weight:800;">(目前尚未加入任何班級)</span>';
                        }
                    } catch (err) {
                        console.error("載入班級失敗", err);
                        switcherContainer.innerHTML = '<span style="color:#EF4444; font-size:0.9rem; font-weight:800;">載入失敗</span>';
                    }
                }
            }, 100);
            
            setTimeout(() => {
                 clearInterval(initInterval);
                 if(!window.supabaseClient) {
                     switcherContainer.innerHTML = '<span style="color:#EF4444; font-size:0.9rem; font-weight:800;">網路連線逾時</span>';
                 }
            }, 5000);
        });

        async function openProfileModal() {
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (!user) return window.showFlash('連線逾時，請重新登入！', 'error');

                const { data: profile, error } = await window.supabaseClient
                    .from('profiles')
                    .select('email, name, phone, raw_data')
                    .eq('id', user.id)
                    .single();
                
                if (error) throw error;

                const rawData = profile.raw_data ? profile.raw_data : {};
                document.getElementById('profile-account').value = profile.email ? profile.email : '未設定';
                document.getElementById('profile-nameEN').value = rawData.nameEN ? rawData.nameEN : '';
                document.getElementById('profile-passLast').value = rawData.passportLast ? rawData.passportLast : '';
                document.getElementById('profile-passFirst').value = rawData.passportFirst ? rawData.passportFirst : '';
                document.getElementById('profile-lastCN').value = rawData.lastNameCN ? rawData.lastNameCN : '';
                document.getElementById('profile-firstCN').value = rawData.firstNameCN ? rawData.firstNameCN : '';
                document.getElementById('profile-phone').value = profile.phone ? profile.phone : '';
                document.getElementById('profile-password').value = '';
                document.getElementById('profile-drive').value = window.ProfileForm
                    ? window.ProfileForm.getDriveDisplay(rawData)
                    : '尚未綁定雲端硬碟';

                const displayName = window.ProfileForm
                    ? window.ProfileForm.calculateDisplayName(rawData, 'en_first')
                    : (profile.name ? profile.name : '');
                document.getElementById('profile-sysDisplayName').value = displayName === '未命名' ? '' : displayName;

                if (window.ProfileForm) {
                    window.ProfileForm.bindPasswordToggle('profile-password-toggle', 'profile-password');
                }

                function updateStudentNamePreview() {
                    if (!window.ProfileForm) return;
                    const localRaw = window.ProfileForm.readNameFieldsFromDom('profile');
                    const calculated = window.ProfileForm.calculateDisplayName(localRaw, 'en_first');
                    document.getElementById('profile-sysDisplayName').value = calculated === '未命名' ? '' : calculated;
                }

                ['profile-nameEN', 'profile-passLast', 'profile-passFirst', 'profile-lastCN', 'profile-firstCN'].forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) el.oninput = updateStudentNamePreview;
                });

                document.getElementById('profile-modal').style.display = 'flex';
            } catch (e) {
                console.error("讀取個資失敗", e);
                window.showFlash('資料讀取失敗，請稍後再試。', 'error');
            }
        }

        async function saveProfile() {
            const newPwd = document.getElementById('profile-password').value.trim();
            const btn = document.querySelector('#profile-modal .btn-primary');
            const nameFields = window.ProfileForm
                ? window.ProfileForm.readNameFieldsFromDom('profile')
                : { nameEN: '', passportLast: '', passportFirst: '', lastNameCN: '', firstNameCN: '' };
            const fullCN = (nameFields.lastNameCN + nameFields.firstNameCN).trim();

            if (!nameFields.nameEN && !fullCN) {
                window.showFlash('請至少填寫英文名字或中文姓名！', 'error');
                return;
            }

            const finalName = document.getElementById('profile-sysDisplayName').value.trim()
                ? document.getElementById('profile-sysDisplayName').value.trim()
                : (fullCN ? fullCN : nameFields.nameEN);
            const newPhone = document.getElementById('profile-phone').value.trim();

            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '⏳ 儲存中...';
            btn.disabled = true;

            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();

                const { data: oldProfile } = await window.supabaseClient
                    .from('profiles')
                    .select('raw_data')
                    .eq('id', user.id)
                    .single();

                const oldRaw = oldProfile && oldProfile.raw_data ? oldProfile.raw_data : {};
                const mergedRaw = Object.assign({}, oldRaw, {
                    nameEN: nameFields.nameEN,
                    passportLast: nameFields.passportLast,
                    passportFirst: nameFields.passportFirst,
                    lastNameCN: nameFields.lastNameCN,
                    firstNameCN: nameFields.firstNameCN
                });

                const { error: profileErr } = await window.supabaseClient
                    .from('profiles')
                    .update({ name: finalName, phone: newPhone, raw_data: mergedRaw })
                    .eq('id', user.id);
                
                if (profileErr) throw profileErr;

                if (newPwd && window.ProfileForm) {
                    await window.ProfileForm.updatePasswordIfProvided(newPwd);
                }

                window.showFlash('個人資料已成功更新！');
                document.getElementById('dynamic-student-title').innerText = 'LogOnEnglish | ' + finalName + ' 🚀';
                document.title = finalName + ' 的專屬教室 | LogOnEnglish';
                document.getElementById('profile-modal').style.display = 'none';

            } catch (err) {
                console.error(err);
                window.showFlash('儲存失敗：' + err.message, 'error');
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
