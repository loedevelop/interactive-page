<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登入 - LogOnEnglish (SaaS 雲端升級版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF8C00;
            --secondary-color: #FFA500;
            --bg-color: #FFF8E1;
            --text-color: #4A4A4A;
            --error-color: #E53935;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(var(--secondary-color) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 140, 0, 0.15);
            width: 100%;
            max-width: 350px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .logo { font-size: 2.5rem; font-weight: 900; color: var(--primary-color); margin-bottom: 5px; letter-spacing: -1px; }
        .subtitle { font-size: 0.9rem; color: #888; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #EEE; border-radius: 10px; font-size: 1rem; box-sizing: border-box; transition: 0.3s; }
        .input-group input:focus { outline: none; border-color: var(--primary-color); }
        
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 45px; }
        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #888;
            padding: 0;
            outline: none;
            transition: 0.2s;
        }
        .toggle-password-btn:hover { color: var(--primary-color); transform: translateY(-50%) scale(1.1); }

        .checkbox-group { display: flex; align-items: center; margin-bottom: 20px; text-align: left; }
        .checkbox-group input { width: 18px; height: 18px; margin-right: 8px; cursor: pointer; accent-color: var(--primary-color); }
        .checkbox-group label { font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #555; }

        .login-btn { background-color: var(--primary-color); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: #E67E22; }
        .login-btn:active { transform: translateY(2px); }
        .login-btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        
        .clear-btn { background-color: #F1F5F9; color: #EF4444; border: 2px solid #FECACA; padding: 10px; width: 100%; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .clear-btn:hover { background-color: #FEE2E2; }

        #error-message { color: var(--error-color); font-size: 0.9rem; margin-top: 15px; min-height: 20px; font-weight: bold; }

        .forgot-link { display: block; text-align: right; margin-top: 8px; margin-bottom: 0; font-size: 0.85rem; font-weight: 700; color: #64748B; cursor: pointer; text-decoration: none; }
        .forgot-link:hover { color: var(--primary-color); text-decoration: underline; }
        #forgot-msg { color: #059669; font-size: 0.85rem; margin-top: 6px; margin-bottom: 0; font-weight: 800; min-height: 18px; text-align: right; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">LogOnEnglish</div>
        <div class="subtitle">效率學習，從這開始！</div>

        <div>
            <div class="input-group">
                <label for="email">使用者 Email (帳號)</label>
                <input type="email" id="email" placeholder="例如: name@test.com">
            </div>
            <div class="input-group">
                <label for="password">密碼</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="請輸入密碼">
                    <button type="button" id="togglePasswordBtn" class="toggle-password-btn" title="顯示密碼">👁️</button>
                </div>
                <a href="#" class="forgot-link" id="forgotPasswordLink">忘記密碼？</a>
                <div id="forgot-msg"></div>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">記住 Email (安全登入)</label>
            </div>

            <button type="button" id="loginBtn" class="login-btn">準備上課！</button>
            <button type="button" class="clear-btn" onclick="clearAllCache()">🧹 登入異常？點我清除快取</button>
            <div id="login-version-tag" style="margin-top:12px; font-size:0.75rem; color:#94A3B8; font-weight:800;">登入引擎 Persona v9</div>
            <div id="error-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 🚨 升級版本號以破除快取，確保讀取最新 API -->
    <script type="module" src="./020_js_core/supabase-client.js?v=18"></script>
    <script src="./020_js_core/persona-routing.js?v=9"></script>

    <script>
        // ==========================================
        // 1. 初始化與快取清理機制
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('clear') === 'true') {
            localStorage.clear();
            sessionStorage.clear();
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function clearAllCache() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('./index.html?clear=true&build=v7&_=' + Date.now());
        }

        async function requestPasswordReset(e) {
            if (e) e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const forgotMsg = document.getElementById('forgot-msg');
            const errorMsg = document.getElementById('error-message');
            errorMsg.textContent = '';
            forgotMsg.textContent = '';

            if (!emailInput) {
                errorMsg.textContent = '⚠️ 請先輸入 Email 再申請重設密碼';
                return;
            }

            let retries = 0;
            while (!window.supabaseClient && retries < 15) {
                await new Promise(function(resolve) { setTimeout(resolve, 200); });
                retries++;
            }
            if (!window.supabaseClient) {
                errorMsg.textContent = '❌ 連線未就緒，請重新整理';
                return;
            }

            const redirectTo = window.buildResetPasswordRedirectUrl
                ? window.buildResetPasswordRedirectUrl()
                : (window.location.origin + '/reset-password.html');

            const { error } = await window.supabaseClient.auth.resetPasswordForEmail(emailInput, {
                redirectTo: redirectTo
            });

            if (error) {
                errorMsg.textContent = '❌ ' + error.message;
                return;
            }

            forgotMsg.textContent = '✅ 已寄出重設連結，請查收 Email（含垃圾郵件）';
        }

        document.getElementById('forgotPasswordLink').addEventListener('click', requestPasswordReset);

        function cancelLoginPicker() {
            const submitBtn = document.getElementById('loginBtn');
            submitBtn.textContent = '準備上課！';
            submitBtn.disabled = false;
            localStorage.removeItem('LogOnEnglish_Session');
            sessionStorage.removeItem('LogOn_Current_User_Id');
            if (window.supabaseClient) window.supabaseClient.auth.signOut();
        }

        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            if (pwdInput.getAttribute('type') === 'password') {
                pwdInput.setAttribute('type', 'text');
                this.textContent = '🙈';
                this.title = '隱藏密碼';
            } else {
                pwdInput.setAttribute('type', 'password');
                this.textContent = '👁️';
                this.title = '顯示密碼';
            }
        });

        // ==========================================
        // 2. 核心分流閘道器 (Auth & Routing Engine)
        // ==========================================
        
        function routeAfterLogin(uid, profile, personas, warning) {
            const submitBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('error-message');

            if (warning) {
                errorMsg.textContent = `⚠️ ${warning}`;
            }

            if (personas.length === 1) {
                submitBtn.textContent = '✅ 登入成功！跳轉中...';
                window.PersonaRouting.executeJump(uid, profile, personas[0], './');
            } else if (personas.length <= 2) {
                submitBtn.textContent = '✅ 登入成功！跳轉中...';
                const selected = window.PersonaRouting.resolvePersonaFromLast(uid, personas);
                window.PersonaRouting.executeJump(uid, profile, selected, './');
            } else {
                submitBtn.textContent = '準備上課！';
                submitBtn.disabled = false;

                let defaultType = localStorage.getItem(window.PersonaRouting.getLastPersonaKey(uid));
                if (!defaultType || !personas.find(function(p) { return p.type === defaultType; })) {
                    defaultType = personas[0].type;
                }

                window.PersonaRouting.openPersonaPicker({
                    uid: uid,
                    profile: profile,
                    personas: personas,
                    defaultType: defaultType,
                    title: '選擇身分',
                    basePath: './',
                    onCancel: cancelLoginPicker
                });
            }
        }

        const RoutingEngine = {
            login: async (email, password) => {
                try {
                    const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (authError) {
                        if (authError.message.includes('Invalid login credentials')) {
                            return { success: false, message: '帳號或密碼錯誤！(請確認已在 Supabase 後台建立帳號)' };
                        }
                        return { success: false, message: '登入失敗: ' + authError.message };
                    }
                    if (!authData.user) return { success: false, message: '找不到此帳號' };

                    const authUserId = authData.user.id;
                    const profileResult = await window.PersonaRouting.resolveProfileForAuth(
                        window.supabaseClient,
                        authUserId,
                        email
                    );
                    if (profileResult.error) {
                        return { success: false, message: profileResult.error };
                    }

                    const scanResult = await window.PersonaRouting.scanPersonas(
                        window.supabaseClient,
                        authUserId,
                        email,
                        profileResult.profile
                    );

                    return {
                        success: true,
                        uid: authUserId,
                        profile: profileResult.profile,
                        personas: scanResult.personas,
                        warning: scanResult.warning
                    };
                } catch (error) {
                    console.error("[Login Error]", error);
                    return { success: false, message: '系統發生例外錯誤，請檢查網路。' };
                }
            }
        };

        // ==========================================
        // 4. 事件綁定
        // ==========================================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            // 登入前強制清除舊的 Session 快取，杜絕幽靈快取
            localStorage.removeItem('LogOnEnglish_Session'); 
            sessionStorage.removeItem('LogOn_Current_User_Id');

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('loginBtn');

            if(!emailInput || !passwordInput) {
                errorMsg.textContent = '⚠️ 請輸入帳號與密碼！';
                return;
            }

            errorMsg.textContent = '';
            submitBtn.textContent = '📡 連線身分掃描中...';
            submitBtn.disabled = true;

            // 等待 Supabase 與 PersonaRouting 載入完成
            let retries = 0;
            while ((!window.supabaseClient || !window.PersonaRouting) && retries < 15) {
                await new Promise(resolve => setTimeout(resolve, 200));
                retries++;
            }

            if(!window.supabaseClient || !window.PersonaRouting) {
                errorMsg.textContent = '❌ 無法載入登入模組，請強制重新整理頁面（Cmd+Shift+R）。';
                submitBtn.textContent = '準備上課！'; 
                submitBtn.disabled = false;
                return;
            }

            const result = await RoutingEngine.login(emailInput, passwordInput);

            if (result.success) {
                // 🔒 資安升級：只記住 Email，絕不明文儲存密碼
                if (rememberMe) {
                    localStorage.setItem('LogOnEnglish_SavedEmail', emailInput);
                } else {
                    localStorage.removeItem('LogOnEnglish_SavedEmail');
                }
                
                // 徹底刪除舊版系統殘留的危險明碼快取
                localStorage.removeItem('LogOnEnglish_Creds'); 

                routeAfterLogin(result.uid, result.profile, result.personas, result.warning);

            } else {
                errorMsg.textContent = `❌ ${result.message}`;
                submitBtn.textContent = '準備上課！'; 
                submitBtn.disabled = false;
            }
        });

        // 綁定 Enter 鍵登入
        document.addEventListener('keydown', (e) => {
            if (window.PersonaRouting && window.PersonaRouting.isPersonaPickerOpen()) return;
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        // 頁面載入時的自動回填與 Session 檢查
        window.addEventListener('DOMContentLoaded', () => {
            // 安全回填 Email
            const savedEmail = localStorage.getItem('LogOnEnglish_SavedEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
                // 自動 Focus 到密碼欄，提升 UX
                document.getElementById('password').focus();
            }
            
            // 清理舊版危險快取 (防禦舊使用者裝置上的殘留)
            localStorage.removeItem('LogOnEnglish_Creds');

            const sessionString = localStorage.getItem('LogOnEnglish_Session');
            const urlParams = new URLSearchParams(window.location.search);

            if (sessionString && urlParams.get('clear') !== 'true') {
                try {
                    const session = JSON.parse(sessionString);
                    if(session.folder) {
                        window.location.replace(`./${session.folder}/index.html`);
                    }
                } catch (e) {
                    localStorage.removeItem('LogOnEnglish_Session');
                }
            }
        });
    </script>
</body>
</html>
